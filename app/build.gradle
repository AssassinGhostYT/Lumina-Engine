
plugins {
    id 'com.android.application'  
}

android {
    namespace 'com.lumina.engine'
    ndkVersion "28.0.13004108"
    compileSdk 36
    buildToolsVersion '37.0.0'
    lint {
    disable 'MissingTranslation', 'TypographyFractions'
    checkOnly 'NewApi', 'HandlerLeak'
    abortOnError false
    checkReleaseBuilds false
    }
    testOptions {
        unitTests.all {
            enabled = false
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: "LuminaEngine.jks"
            def keystoreFile = file(keystorePath)
            def storePass = System.getenv("KEYSTORE_PASSWORD")
            def keyAliasName = System.getenv("KEY_ALIAS")
            // CI without signing secrets must still produce an installable APK (debug-signed).
            if (keystoreFile.exists() && storePass && keyAliasName) {
                storeFile keystoreFile
                storePassword storePass
                keyAlias keyAliasName
                keyPassword System.getenv("KEY_PASSWORD") ?: storePass
            } else {
                println "Release keystore/credentials not found. Using debug signing."
                initWith signingConfigs.debug
            }
        }
    }
    defaultConfig {
        applicationId "com.lumina.engine"
        minSdk 24
        targetSdk 36
        versionCode 101
        versionName "1.0.1"
        // AdMob: the app id must be declared before the Mobile Ads SDK is initialized.
        manifestPlaceholders["admobAppId"] = "ca-app-pub-5858301436237272~5737636624"
        buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"ca-app-pub-5858301436237272/3433751966\""
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
        vectorDrawables { 
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    if (file("google-services.json").exists()) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }

    buildFeatures {
        buildConfig true
    }
    
}

ext {
    gdxVersion = '1.14.2'
}

configurations { natives }

dependencies {

    implementation("com.google.android.material:material:1.14.0")
    implementation(projects.formatter)
    implementation("com.android.billingclient:billing:9.1.0")
    // AdMob banner shown only on the projects home screen.
    implementation("com.google.android.gms:play-services-ads:25.4.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.appcompat:appcompat:1.7.1")
    implementation(fileTree(dir: "libs", include: ["*.jar","*.aar"]))
    implementation("com.github.bumptech.glide:glide:4.16.0")
    implementation("com.google.code.gson:gson:2.10.1")
    // AI remote control: WebSocket to the Lumina Engine Remote server
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    // Git (HTTPS only): JGit 5.13 is the last line that runs on Java 8 / Android
    implementation("org.eclipse.jgit:org.eclipse.jgit:5.13.3.202401111512-r") {
        exclude group: 'org.slf4j'
    }
    implementation("org.slf4j:slf4j-nop:1.7.36")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")
    implementation("com.google.guava:guava:32.0.1-android")
    implementation("com.android.tools:r8:8.1.56")
    implementation(platform("io.github.rosemoe:editor-bom:0.24.5"))
    implementation("io.github.rosemoe:editor")
    implementation("io.github.rosemoe:language-textmate")
    implementation("com.badlogicgames.gdx:gdx:$gdxVersion")
    implementation("com.badlogicgames.gdx:gdx-freetype:$gdxVersion")
    implementation("com.badlogicgames.gdx:gdx-backend-android:$gdxVersion")
    implementation("com.badlogicgames.gdx:gdx-box2d:$gdxVersion")
    implementation("com.badlogicgames.gdx:gdx-bullet:$gdxVersion")
    implementation("com.github.mgsx-dev.gdx-gltf:gltf:2.2.1")
    implementation("com.kotcrab.vis:vis-ui:1.5.9")
    
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"

    
    testImplementation("com.badlogicgames.gdx:gdx-platform:$gdxVersion")
    testImplementation("com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion")
    testImplementation("com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion")
    
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.21") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.3.21") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    
    implementation(platform("com.google.firebase:firebase-bom:34.3.0"))
    implementation("com.google.firebase:firebase-crashlytics-ndk")
    implementation("com.google.firebase:firebase-analytics")


}

// Called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86_64/").mkdirs()
        file("libs/x86/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if(jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if(jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if(jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if(jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if(outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyAndroidNatives'
}
