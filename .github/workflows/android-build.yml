name: Build APK

# Every push to main (and every pull request) produces an installable APK.
# Run it by hand from Actions -> Build APK -> Run workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;37.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          echo "### Lumina Engine APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download it from the **Artifacts** section of this run: **LuminaEngine-apk**." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The CI APK is debug-signed, so it installs on any phone without extra setup. For a release-signed build use the *Aab & Apk Build* workflow with the signing secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuminaEngine-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
