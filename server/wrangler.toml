name = "lumina"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# One Durable Object per user (named by the user's secret). SQLite-backed = allowed on the free plan.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# AI.md is bundled into the Worker as text
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# Calls one secret may make per day (protects the free plan when many people share this server).
DAILY_CALLS = "4000"
# How long (hours) an idle user's data is kept after the phone disconnects.
IDLE_PURGE_HOURS = "24"

# --- Nebulon Store -----------------------------------------------------------------
# Create them first (see store/README.md), then uncomment and set the real database_id.
[[d1_databases]]
binding = "STORE_DB"
database_name = "lumina-store"
database_id = "e0d4865d-9c36-47be-8f0a-a6e6a5e8b76c"
#
# [[r2_buckets]]
# binding = "STORE_R2"
# bucket_name = "lumina-store"
#
# Free alternative to R2 (no card, 1 GB, max 24 MB per file). Create it with:
#   wrangler kv namespace create STORE_KV
[[kv_namespaces]]
binding = "STORE_KV"
id = "57819ab3cbf84a79960b5ebcdbfab30f"
#
# Set the publishing token with: wrangler secret put STORE_ADMIN_TOKEN
